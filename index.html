<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }
    </style>
  </head>
  <body>
    <h3>Online Users</h3>
    <ul id="online"></ul>
    <p id="typing"></p>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      // collect nickname
      const nickName = prompt("Enter Your NickName");

      // send nick name of server
      socket.emit("set nickname", nickName);

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const onlineList = document.getElementById("online");
      const typingDiv = document.getElementById("typing");

      socket.on("typing", (nickname) => {
        typingDiv.textContent = `${nickname} is typing...`;
      });

      socket.on("stop typing", () => {
        typingDiv.textContent = "";
      });

      input.addEventListener("input", () => {
        if (input.value.trim() !== "") {
          socket.emit("typing");
        } else {
          socket.emit("stop typing");
        }
      });

      socket.on("online user", (users) => {
        onlineList.innerHTML = "";

        users.forEach((user) => {
          const li = document.createElement("li");
          li.textContent = user;
          onlineList.appendChild(li);
        });
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value) {
          // typing stop karo
          socket.emit("stop typing");

          const item = document.createElement("li");
          item.textContent = `You: ${input.value}`;
          messages.appendChild(item);
          socket.emit("chat message", input.value);
          input.value = "";
        }
      });

      socket.on("chat message", (msg) => {
        const item = document.createElement("li");
        item.textContent = `${msg.nickname}: ${msg.message}`;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });
    </script>
  </body>
</html>
